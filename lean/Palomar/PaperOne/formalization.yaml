    id: "https://arxiv.org/abs/1808.01513v2"
    location: "Sections 2--3: cellular cochains, coboundaries and Hodge theory."
    relationship: "adapts"
    note: >-
      The finite coordinate cellular model uses incidence-weighted stalk
      restriction maps and the actual adjoint Hodge operator. This adapts
      that mathematical setup for the declared finite real model; it is not
      a formalization of the whole paper.

