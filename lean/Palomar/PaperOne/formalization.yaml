fidelity:
  divergences: >-
    Finite real matrix statements use orthonormal coordinates. The generated
    subspace result concerns a field-linear image and does not prove integer
    lattice membership. Discrete CVP comparisons retain the explicit lattice,
    its harmonic-subspace inclusion and orthogonal projection; coefficient
    recovery is noncomputable in a supplied integral harmonic presentation.
    General ambiguity is conditional on the declared closed-test invariance,
    kernel separation and, for the oracle corollaries, existence of a correct
    explicit-lattice CVP oracle with the stated uniform-solver quantifiers.
    The cellular carrier records finite graded cells and integer incidences;
    no regular CW or simplicial realization of the example's base is asserted.
    The family constructs the homological test fragment, not full
    first-order semantics. The exact-component obstruction requires an allowed
    nonzero coexact direction and does not prove factorization of a concrete
    wire serializer. Plucker recovery uses full exact-real projective data
    and a fixed metric; operative recovery additionally identifies the
    recovered carrier with the actual matrix kernel. No asymptotic hardness,
    distributional security, efficient decoding, digest inversion or novelty
    claim follows from the selected theorems.

