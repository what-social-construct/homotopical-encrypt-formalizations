version: "v0.4"

project:
  name: "Hidden Hodge Targets and Discrete Closest Vectors"
  description: >-
    We formalize unique finite real Hodge decomposition, private harmonic and
    lattice coefficient recovery, and preservation of discrete closest-vector
    answers under projection onto a subspace containing the supplied lattice.
    Finite signed-incidence examples share cohomological public observations
    but have distinct nonzero harmonic targets or integer coefficients. Under
    closed-test invariance and optional reflection, public fibers coincide
    with the declared typed homotopy classes; the constructed family satisfies
    this profile. General oracle results retain their invariance, separation
    and correct-oracle existence hypotheses. One fixed correct rank-one CVP
    oracle recovers the target given the operative lattice, while the shared
    public class and cochain cannot select the hidden member’s answer. These
    are exact recovery and comparison results, without asymptotic hardness or
    cryptographic security claims.
  authors:
    - "Chloe van der Vlugt"
  responsible_maintainers:
    - "Chloe van der Vlugt"
  license: "MIT"

classification:
  arxiv: ["math.AT", "math.LO"]
  msc2020: ["55N30", "55U35", "15A63"]

